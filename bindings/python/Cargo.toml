[package]
name = "bytehaul-python"
version.workspace = true
edition = "2021"
description = "Python extension module for the bytehaul async download library"
publish = false
license = "MIT"
readme = "README.md"
repository = "https://github.com/triwinds/bytehaul"
documentation = "https://github.com/triwinds/bytehaul/tree/main/bindings/python"

[lib]
name = "_bytehaul"
crate-type = ["cdylib"]

[features]
# Wheels and source builds must use the same libcurl backend as the Rust
# package, even if the root package changes its default feature in the future.
default = ["curl-backend"]
curl-backend = ["bytehaul/curl-backend"]

[dependencies]
bytehaul = { path = "../..", default-features = false }
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(not(windows))'.dependencies]
# Force the vendored (openssl-src) build for every non-Windows build of this
# extension so wheels never link a build-host OpenSSL: the manylinux container
# and the Homebrew prefix would otherwise leak build paths and library
# versions that user machines do not have. Windows keeps Schannel and never
# links OpenSSL. This direct dependency exists only to unify
# openssl-sys/vendored into the graph built by curl-sys/ssl.
openssl-sys = { version = "0.9", features = ["vendored"] }
