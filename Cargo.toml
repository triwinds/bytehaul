[package]
name = "bytehaul"
version.workspace = true
edition = "2021"
description = "Async HTTP download library with resume, multi-connection, rate limiting, and checksum verification"
license = "MIT"
readme = "README.md"
repository = "https://github.com/triwinds/bytehaul"
documentation = "https://docs.rs/bytehaul"
keywords = ["download", "http", "async", "resume", "range"]
categories = ["asynchronous", "network-programming", "web-programming::http-client"]
publish = ["crates-io"]
exclude = [
    "/.agents/**",
    "/.trellis/**",
    "/.codex/**",
    "/.cursor/**",
    "/.claude/**",
    "/.github/**",
    "/.uv-cache/**",
    "/AGENTS.md",
    "/docs/private/**",
]

[workspace]
members = ["bindings/python"]
resolver = "2"

[workspace.package]
version = "0.2.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[features]
default = ["curl-backend"]
# libcurl transport backend (the sole production transport after P6).
curl-backend = ["dep:curl", "dep:curl-sys"]

[dependencies]
tokio = { version = "1", features = ["full"] }
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio", "system-config", "https-ring", "rustls-platform-verifier"] }
# Neutral HTTP types: the worker, the sessions and the transport adapters all
# speak `http::{Request, Response, HeaderMap, StatusCode}` (see src/http/mod.rs).
http = "1"
# Vendored libcurl driver; see docs/libcurl-migration-plan.zh-CN.md (P0/P2).
curl = { version = "0.4.50", features = ["static-curl"], optional = true }
# Raw libcurl options the `curl` crate does not wrap yet
# (`CURLMOPT_NETWORK_CHANGED`, see src/network/curl/driver/mod.rs).
curl-sys = { version = "0.4.89", default-features = false, optional = true }
bytes = "1"
futures = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1"
bitvec = { version = "1", features = ["serde"] }
parking_lot = "0.12"
tracing = "0.1"
crc32fast = "1"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
fastrand = "2"
url = "2"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = "0.3"
warp = "0.3"
rand = "0.9"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "storage_bench"
harness = false

[[bench]]
name = "pipeline_bench"
harness = false
