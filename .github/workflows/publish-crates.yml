name: Publish Rust Crate

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match the v<version> tag)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish bytehaul to crates.io
    runs-on: ubuntu-latest

    environment:
      name: crates-io
      url: https://crates.io/crates/bytehaul

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure tag matches crate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib


          def resolve_package_version(manifest, manifest_name):
            package = manifest.get("package", {})
            version = package.get("version")
            if isinstance(version, str):
              return version

            if isinstance(version, dict) and version.get("workspace"):
              workspace_version = manifest.get("workspace", {}).get("package", {}).get("version")
              if isinstance(workspace_version, str):
                return workspace_version
              raise SystemExit(
                f"{manifest_name} uses version.workspace but has no workspace.package.version"
              )

            raise SystemExit(f"Could not determine version for {manifest_name}")

          input_version = os.environ.get("INPUT_VERSION", "").strip()
          if input_version:
              version = input_version
              if version.startswith("v"):
                  raise SystemExit(f"Pass the version without a leading 'v', got {version!r}")
              tag = f"v{version}"
          else:
              tag = os.environ["GITHUB_REF_NAME"]
              if not tag.startswith("v"):
                  raise SystemExit(f"Expected a v-prefixed tag, got {tag!r}")
              version = tag[1:]

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text("utf-8"))
          actual = resolve_package_version(manifest, "Cargo.toml")
          if actual != version:
              raise SystemExit(f"Tag version {version} does not match Cargo.toml version {actual}")

          print(f"Validated release tag v{version} for crate bytehaul.")
          PY

      - name: Verify backfill ref matches the release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="v${INPUT_VERSION}"
          git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null || { echo "::error::tag ${TAG} not found in this checkout"; exit 1; }
          if git diff --quiet "${TAG}^{commit}" HEAD -- ':(exclude).github'; then
            echo "HEAD matches ${TAG} outside .github; backfill is source-equivalent to the tag."
          else
            echo "::error::backfill refused: code differs from ${TAG} outside .github"
            git --no-pager diff --stat "${TAG}^{commit}" HEAD -- ':(exclude).github'
            exit 1
          fi

      - name: Verify package contents
        run: cargo package --list -p bytehaul

      - name: Verify production feature builds
        run: |
          cargo check -p bytehaul --locked
          cargo check -p bytehaul --locked --no-default-features --features curl-backend

      - name: Dry-run publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --dry-run -p bytehaul --locked --registry crates-io

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p bytehaul --locked --registry crates-io
