name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust tests (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: curl-default
            feature_args: ""
          - os: ubuntu-latest
            backend: curl-only
            feature_args: --no-default-features --features curl-backend
          - os: windows-latest
            backend: curl-default
            feature_args: ""
          - os: windows-latest
            backend: curl-only
            feature_args: --no-default-features --features curl-backend
          - os: macos-latest
            backend: curl-default
            feature_args: ""
          - os: macos-latest
            backend: curl-only
            feature_args: --no-default-features --features curl-backend

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run unit tests
        run: cargo test -p bytehaul --all-targets ${{ matrix.feature_args }}

      - name: Run doc tests
        run: cargo test -p bytehaul --doc ${{ matrix.feature_args }}

      - name: Clippy lint check
        run: cargo clippy --workspace --all-targets ${{ matrix.feature_args }} -- -D warnings

      - name: Check documentation builds without warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace ${{ matrix.feature_args }}

  coverage:
    name: Coverage gate (≥95%)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-coverage-${{ hashFiles('scripts/coverage-config.json', '**/Cargo.lock') }}

      - name: Test coverage entry
        run: python3 -m unittest discover -s scripts/tests -p 'test_coverage.py'

      - name: Run Linux coverage gate with pinned tools
        run: python3 scripts/coverage.py --install

      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-coverage-${{ github.sha }}
          path: target/coverage/reports/
          if-no-files-found: warn
          retention-days: 14

  python-tests:
    name: Python binding tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync Python dev environment
        run: uv sync --project bindings/python

      - name: Build Python extension (dev)
        working-directory: bindings/python
        run: uv run maturin develop --bindings pyo3 --no-default-features --features curl-backend

      - name: Run Python tests
        working-directory: bindings/python
        run: uv run pytest
