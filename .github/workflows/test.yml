name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Darwin only configures 127.0.0.1 on lo0 by default. The multi-IP
      # integration tests need two loopback listeners on one port, plus one
      # configured-but-unbound address that fails immediately.
      - name: Configure macOS loopback test addresses
        if: matrix.os == 'macos-latest'
        run: |
          sudo ifconfig lo0 alias 127.0.0.2 up
          sudo ifconfig lo0 alias 127.0.0.3 up

      - name: Run unit tests
        run: cargo test -p bytehaul --all-targets

      - name: Run doc tests
        run: cargo test -p bytehaul --doc

      - name: Clippy lint check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check documentation builds without warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace

      # `default = ["curl-backend"]`, so this resolves to the same feature set
      # as the default build; the step keeps the explicitly spelled-out
      # configuration (used by the Python bindings and downstream builders)
      # verified without a second full test job per platform.
      - name: Check explicit curl-only feature configuration
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p bytehaul --no-default-features --features curl-backend

  coverage:
    name: Coverage gate (≥95%)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-coverage-${{ hashFiles('scripts/coverage-config.json', '**/Cargo.lock') }}

      - name: Test coverage entry
        run: python3 -m unittest discover -s scripts/tests -p 'test_coverage.py'

      - name: Run Linux coverage gate with pinned tools
        run: python3 scripts/coverage.py --install

      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-coverage-${{ github.sha }}
          path: target/coverage/reports/
          if-no-files-found: warn
          retention-days: 14

  python-tests:
    name: Python binding tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync Python dev environment
        run: uv sync --project bindings/python

      - name: Build Python extension (dev)
        working-directory: bindings/python
        run: uv run maturin develop --bindings pyo3 --no-default-features --features curl-backend

      - name: Run Python tests
        working-directory: bindings/python
        run: uv run pytest
