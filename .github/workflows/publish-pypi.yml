# PyPI Trusted Publisher configuration:
#   Owner: triwinds
#   Repository: bytehaul
#   Workflow file: publish-pypi.yml
#   Environment: pypi
#
# Wheel TLS dependencies: libcurl links the platform TLS stack (Schannel on
# Windows, OpenSSL elsewhere). The Linux wheel is built in a manylinux_2_34
# container whose system OpenSSL is 3.x (curl-sys requires OpenSSL >= 3.0;
# manylinux_2_28 only ships 1.1.1) with openssl-devel installed, and maturin
# bundles the linked libs. The macOS wheels are repaired with delocate to
# bundle the Homebrew OpenSSL dylibs, which requires macOS 15 or newer. Every
# wheel is then verified in a clean environment, including an HTTPS smoke test
# against example.com.
#
# Backfill: workflow_dispatch accepts a version and requires that the dispatch
# ref matches the v<version> tag outside .github, so a retried release builds
# from source equivalent to the tag. Set dry_run to build and verify without
# publishing.
name: Publish Python Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and publish (must match the v<version> tag)"
        required: true
        type: string
      dry_run:
        description: "Build and verify wheels without publishing to PyPI"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  verify-release:
    name: Verify release metadata
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Ensure version matches package versions
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib


          def resolve_package_version(manifest, manifest_name, workspace_manifest=None):
            package = manifest.get("package", {})
            version = package.get("version")
            if isinstance(version, str):
              return version

            if isinstance(version, dict) and version.get("workspace"):
              workspace_version = manifest.get("workspace", {}).get("package", {}).get("version")
              if not isinstance(workspace_version, str) and workspace_manifest is not None:
                workspace_version = (
                  workspace_manifest.get("workspace", {}).get("package", {}).get("version")
                )
              if isinstance(workspace_version, str):
                return workspace_version
              raise SystemExit(
                f"{manifest_name} uses version.workspace but no workspace.package.version could be resolved"
              )

            raise SystemExit(f"Could not determine version for {manifest_name}")

          input_version = os.environ.get("INPUT_VERSION", "").strip()
          if input_version:
              version = input_version
              if version.startswith("v"):
                  raise SystemExit(f"Pass the version without a leading 'v', got {version!r}")
          else:
              tag = os.environ["GITHUB_REF_NAME"]
              if not tag.startswith("v"):
                  raise SystemExit(f"Expected a v-prefixed tag, got {tag!r}")
              version = tag[1:]

          root_manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text("utf-8"))
          python_manifest = tomllib.loads(pathlib.Path("bindings/python/Cargo.toml").read_text("utf-8"))
          pyproject = tomllib.loads(pathlib.Path("bindings/python/pyproject.toml").read_text("utf-8"))

          expected = {
              "workspace crate": resolve_package_version(root_manifest, "Cargo.toml"),
              "python binding crate": resolve_package_version(
                  python_manifest,
                  "bindings/python/Cargo.toml",
                  workspace_manifest=root_manifest,
              ),
          }

          mismatches = {
              name: actual
              for name, actual in expected.items()
              if actual != version
          }
          if mismatches:
              details = ", ".join(f"{name}={actual}" for name, actual in mismatches.items())
              raise SystemExit(f"Version {version} does not match manifest versions: {details}")

          if pyproject["project"]["name"] != "bytehaul":
              raise SystemExit("The PyPI project name changed; update the workflow environment URL.")

          print(f"Validated release version {version} for PyPI project {pyproject['project']['name']}.")
          PY

      - name: Verify backfill ref matches the release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="v${INPUT_VERSION}"
          git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null || { echo "::error::tag ${TAG} not found in this checkout"; exit 1; }
          if git diff --quiet "${TAG}^{commit}" HEAD -- ':(exclude).github'; then
            echo "HEAD matches ${TAG} outside .github; backfill is source-equivalent to the tag."
          else
            echo "::error::backfill refused: code differs from ${TAG} outside .github"
            git --no-pager diff --stat "${TAG}^{commit}" HEAD -- ':(exclude).github'
            exit 1
          fi

  build-wheels:
    name: Build wheel (${{ matrix.label }})
    needs: verify-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            interpreter: python3.9
            manylinux: "2_34"
          - os: windows-latest
            label: windows-x86_64
            interpreter: python
            manylinux: "auto"
          - os: macos-15-intel
            label: macos-x86_64
            interpreter: python
            manylinux: "auto"
          - os: macos-15
            label: macos-arm64
            interpreter: python
            manylinux: "auto"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --release
            --manifest-path bindings/python/Cargo.toml
            --no-default-features
            --features curl-backend
            --out dist
            --compatibility pypi
            --interpreter ${{ matrix.interpreter }}
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: |
            dnf install -y openssl-devel pkgconf-pkg-config
            openssl version
            pkg-config --modversion openssl

      - name: Bundle linked dylibs into the wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -m pip install --quiet delocate
          delocate-wheel -v -w wheelhouse dist/*.whl
          rm -f dist/*.whl
          mv wheelhouse/*.whl dist/

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    needs: verify-release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path bindings/python/Cargo.toml --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions-sdist
          path: dist/*
          if-no-files-found: error

  verify-wheels:
    name: Verify wheel (${{ matrix.label }})
    needs: build-wheels
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            artifact: python-package-distributions-linux-x86_64
          - os: windows-latest
            label: windows-x86_64
            artifact: python-package-distributions-windows-x86_64
          - os: macos-15-intel
            label: macos-x86_64
            artifact: python-package-distributions-macos-x86_64
          - os: macos-15
            label: macos-arm64
            artifact: python-package-distributions-macos-arm64

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.artifact }}
          path: dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install wheel in a clean environment and smoke test
        shell: bash
        run: |
          VERSION="${RELEASE_VERSION#v}"
          python -m venv "$RUNNER_TEMP/bytehaul-wheel-check"
          if [ -x "$RUNNER_TEMP/bytehaul-wheel-check/bin/python" ]; then
            PY="$RUNNER_TEMP/bytehaul-wheel-check/bin/python"
          else
            PY="$RUNNER_TEMP/bytehaul-wheel-check/Scripts/python.exe"
          fi
          "$PY" -m pip install --quiet --no-index --only-binary=:all: --find-links dist "bytehaul==${VERSION}"
          "$PY" - "$VERSION" <<'PY'
          import os
          import sys
          import tempfile

          import bytehaul

          expected = sys.argv[1]
          assert bytehaul.__version__ == expected, (bytehaul.__version__, expected)

          with tempfile.TemporaryDirectory() as tmp:
              target = os.path.join(tmp, "index.html")
              bytehaul.download("https://example.com/", output_path=target)
              assert os.path.getsize(target) > 0, "empty download"

          print(f"bytehaul {expected}: import + HTTPS smoke test passed")
          PY

  publish-pypi:
    name: Publish to PyPI
    needs:
      - build-wheels
      - build-sdist
      - verify-wheels
    # Skipped for workflow_dispatch with dry_run enabled (null on tag pushes).
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/bytehaul/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          pattern: python-package-distributions-*
          path: dist
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
